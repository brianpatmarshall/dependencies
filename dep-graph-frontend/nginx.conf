# The SPA, and a proxy to the API so the browser only ever talks to one origin.
#
# The upstream name `backend` is load-bearing: it is the compose service name, and nginx
# resolves it at startup and refuses to start if it cannot. That is why the frontend
# service depends on the backend being healthy rather than merely started.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: any path that is not a real file is the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The scan endpoint is server-sent events. Buffering would hold the whole stream
        # until the scan finished, which is exactly the feedback the stream exists to give.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # A full estate scan takes minutes. The default 60s read timeout would drop it.
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }

    location = /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
    }
}
